<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="boss-glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="boss-glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="boss-hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a081a" />
      <stop offset="50%" stop-color="#140410" />
      <stop offset="100%" stop-color="#080206" />
    </linearGradient>
  </defs>

  <!-- Grounding Shadow Field -->
  <ellipse cx="64" cy="116" rx="44" ry="8" fill="rgba(255, 0, 84, 0.25)" filter="url(#boss-glow-red)" />

  <!-- Radiating Encrypted Bus Tendrils / Spikes -->
  <path d="M64 24 L24 8 M64 24 L104 8 M64 36 L12 40 M64 36 L116 40 M64 64 L16 84 M64 64 L112 84" 
        stroke="#ff0054" stroke-width="2" stroke-dasharray="4,3" opacity="0.85" filter="url(#boss-glow-red)" />

  <!-- Heat Sink Cooling Fins (Left & Right) -->
  <polygon points="26,44 14,56 24,70 34,58" fill="#1b0818" stroke="#ffb703" stroke-width="1.8" filter="url(#boss-glow-gold)" />
  <polygon points="102,44 114,56 104,70 94,58" fill="#1b0818" stroke="#ffb703" stroke-width="1.8" filter="url(#boss-glow-gold)" />
  
  <polygon points="20,68 8,82 18,94 30,82" fill="#1b0818" stroke="#ff0054" stroke-width="1.8" />
  <polygon points="108,68 120,82 110,94 98,82" fill="#1b0818" stroke="#ff0054" stroke-width="1.8" />

  <!-- Main Armored Carapace Body -->
  <polygon points="64,14 96,38 90,84 64,112 38,84 32,38" 
           fill="url(#boss-hull)" stroke="#ff0054" stroke-width="3" filter="url(#boss-glow-red)" />

  <!-- Inner Circuit Sub-Plate -->
  <polygon points="64,28 84,46 80,78 64,98 48,78 44,46" 
           fill="#0c020a" stroke="#ffb703" stroke-width="1.5" />

  <!-- Optical Sensor Array / Rootkit Core -->
  <circle cx="64" cy="56" r="14" fill="#180008" stroke="#ff0054" stroke-width="2.5" filter="url(#boss-glow-red)" />
  <circle cx="64" cy="56" r="9" fill="#ff0054" />
  <circle cx="64" cy="56" r="4" fill="#ffffff" />
  
  <!-- Auxiliary Sensor Clusters -->
  <circle cx="50" cy="42" r="3.5" fill="#ffb703" />
  <circle cx="78" cy="42" r="3.5" fill="#ffb703" />
  <circle cx="50" cy="74" r="3" fill="#ff0054" />
  <circle cx="78" cy="74" r="3" fill="#ff0054" />

  <!-- Data Flow Traces -->
  <line x1="64" y1="70" x2="64" y2="96" stroke="#ffb703" stroke-width="2" stroke-dasharray="2,2" />
  <line x1="52" y1="56" x2="40" y2="56" stroke="#ff0054" stroke-width="2" />
  <line x1="76" y1="56" x2="88" y2="56" stroke="#ff0054" stroke-width="2" />

  <!-- Core Crown Glyphs -->
  <polygon points="64,20 68,26 60,26" fill="#ffb703" />
</svg>

