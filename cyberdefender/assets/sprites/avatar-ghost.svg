<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="ghost-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ghost-violet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="ghost-cloak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#070c14" />
      <stop offset="100%" stop-color="#190d2e" />
    </linearGradient>
    <linearGradient id="ghost-inner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- 1. Broken / Scanline Ground Shadow -->
  <g class="ghost-shadow" opacity="0.75">
    <ellipse cx="32" cy="58" rx="16" ry="3" fill="#000000" />
    <!-- Glitch scanline cuts -->
    <line x1="18" y1="57" x2="30" y2="57" stroke="#00f0ff" stroke-width="0.75" opacity="0.6" />
    <line x1="34" y1="57" x2="44" y2="57" stroke="#7b2cbf" stroke-width="0.75" opacity="0.7" />
    <line x1="22" y1="59" x2="40" y2="59" stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.8" />
  </g>

  <!-- 2. Fragmented Digital Pixels / Glitch Decoherence Particles -->
  <g class="ghost-fragments" fill="#00f0ff" opacity="0.85" filter="url(#ghost-cyan-glow)">
    <rect x="17" y="32" width="2" height="2" />
    <rect x="15" y="38" width="1.5" height="1.5" fill="#9d4edd" />
    <rect x="18" y="44" width="2" height="2" />
    <rect x="20" y="50" width="1.5" height="1.5" />
    <rect x="45" y="34" width="2" height="2" fill="#9d4edd" />
    <rect x="47" y="40" width="1.5" height="1.5" />
    <rect x="44" y="46" width="2" height="2" fill="#00f0ff" />
    <rect x="42" y="52" width="1.5" height="1.5" fill="#9d4edd" />
    <!-- Floating micro bits -->
    <rect x="13" y="41" width="1" height="1" fill="#00f0ff" opacity="0.6" />
    <rect x="49" y="37" width="1" height="1" fill="#9d4edd" opacity="0.6" />
  </g>

  <!-- 3. Cloak & Body Silhouette -->
  <!-- Back Cloak Layer -->
  <path d="M26 26 L19 48 L22 55 L32 53 L42 55 L45 48 L38 26 Z" fill="#070c14" stroke="#1f2d42" stroke-width="0.8" />

  <!-- Stealth Tapered Body -->
  <path d="M25 26 L23 42 L27 54 L32 55 L37 54 L41 42 L39 26 Z" fill="url(#ghost-cloak-grad)" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Inner Violet Shroud Inset -->
  <path d="M28 27 L26 40 L30 52 L32 53 L34 52 L38 40 L36 27 Z" fill="#110a24" stroke="#7b2cbf" stroke-width="0.5" />

  <!-- Circuit Spine / Data Traces -->
  <line x1="32" y1="27" x2="32" y2="50" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="3 1.5" filter="url(#ghost-cyan-glow)" />
  <path d="M27 34 L32 37 L37 34" fill="none" stroke="#7b2cbf" stroke-width="0.75" />
  <path d="M26 42 L32 45 L38 42" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.8" />

  <!-- Stealth Boots / Floating Digital Nodes -->
  <rect x="26" y="53" width="4" height="2" rx="0.5" fill="#05080f" stroke="#00f0ff" stroke-width="0.5" />
  <rect x="34" y="53" width="4" height="2" rx="0.5" fill="#05080f" stroke="#00f0ff" stroke-width="0.5" />
  <circle cx="28" cy="54" r="0.75" fill="#00f0ff" />
  <circle cx="36" cy="54" r="0.75" fill="#00f0ff" />

  <!-- 4. Arms & Sleeves -->
  <path d="M25 26 L20 38 L22 41 L25 32 Z" fill="#09101b" stroke="#1f2d42" stroke-width="0.7" />
  <path d="M39 26 L44 38 L42 41 L39 32 Z" fill="#09101b" stroke="#1f2d42" stroke-width="0.7" />
  <circle cx="21" cy="40" r="1" fill="#7b2cbf" filter="url(#ghost-violet-glow)" />
  <circle cx="43" cy="40" r="1" fill="#00f0ff" filter="url(#ghost-cyan-glow)" />

  <!-- 5. Head & Smooth Helm / Hood Cowl -->
  <!-- Hood Cowl -->
  <path d="M32 9 C23 9 22 17 22 23 C22 28 26 29 32 29 C38 29 42 28 42 23 C42 17 41 9 32 9 Z" fill="#060a12" stroke="#1d2c40" stroke-width="1" />
  
  <!-- Sleek Faceless Helm Visage -->
  <ellipse cx="32" cy="20" rx="8" ry="8.5" fill="#03050a" stroke="#0d1b2a" stroke-width="0.8" />

  <!-- Horizontal Cyan Visor Slit -->
  <rect x="25" y="19" width="14" height="2.5" rx="1.25" fill="#00f0ff" filter="url(#ghost-cyan-glow)" />
  <!-- Visor Internal Pulse Grid -->
  <line x1="27" y1="20.25" x2="37" y2="20.25" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" />

  <!-- Forehead Telemetry Dot -->
  <circle cx="32" cy="14" r="0.8" fill="#7b2cbf" filter="url(#ghost-violet-glow)" />
</svg>
