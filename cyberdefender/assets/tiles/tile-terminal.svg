<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="glow-terminal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" fill="#06121f" stroke="#00f0ff" stroke-width="1" />
  <!-- Terminal Console Pillar -->
  <rect x="10" y="8" width="28" height="24" rx="3" fill="#040a12" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-terminal)" />
  <rect x="14" y="12" width="20" height="14" fill="#00f0ff" fill-opacity="0.15" />
  <text x="24" y="23" font-family="monospace" font-size="9" fill="#00f0ff" text-anchor="middle">&gt;_</text>
  <rect x="18" y="32" width="12" height="10" fill="#0a1928" stroke="#00f0ff" stroke-width="1" />
</svg>

