<body>

  <!-- Layer 1 WebGL Canvas (3D mode; offscreen bitmap shared cleanly with Pixel 2D backdrop) -->
  <canvas id="crt-scene-canvas" class="crt-canvas" aria-hidden="true" tabindex="-1"></canvas>

  <!-- Fixed Full-Viewport App Shell -->
  <div id="prototype-app" class="prototype-app">

    <!-- Layer 3: Strict One-Row Mobile Header & Display-Mode Selector -->
    <header class="proto-header" id="proto-header">
      <nav class="proto-nav" aria-label="Prototype controls and return navigation">
        <a href="/explore/" class="ctrl-btn ctrl-btn--return" aria-label="Current Explore">
          <span class="lbl-full">◂ Current Explore</span>
          <span class="lbl-compact" aria-hidden="true">◂ Explore</span>
        </a>

        <fieldset class="display-mode-fieldset" id="display-mode-group">
          <legend class="display-mode-legend">DISPLAY MODE</legend>
          <label class="mode-option" for="mode-radio-3d">
            <input type="radio" name="display-mode" id="mode-radio-3d" value="3d" class="mode-radio sr-only" aria-label="3D Workstation" />
            <span class="mode-pill">
              <span class="lbl-full">3D WORKSTATION</span>
              <span class="lbl-compact" aria-hidden="true">3D</span>
            </span>
          </label>
          <label class="mode-option" for="mode-radio-2d">
            <input type="radio" name="display-mode" id="mode-radio-2d" value="2d" class="mode-radio sr-only" aria-label="Pixel 2D Workstation" />
            <span class="mode-pill">
              <span class="lbl-full">PIXEL 2D</span>
              <span class="lbl-compact" aria-hidden="true">PIXEL 2D</span>
              <span class="lbl-tiny" aria-hidden="true">2D</span>
            </span>
          </label>
        </fieldset>

        <div id="debug-controls" class="ctrl-group ctrl-group--debug" role="group" aria-label="Debug inspection controls" hidden>
          <label for="quality-select" class="sr-only">3D graphics quality tier</label>
          <select id="quality-select" class="ctrl-btn ctrl-select" aria-label="3D graphics quality tier">
            <option value="auto">3D TIER: AUTO</option>
            <option value="high">3D TIER: HIGH</option>
            <option value="medium">3D TIER: MEDIUM</option>
          </select>
          <label for="pixel-mode-select" class="sr-only">Pixel 3D comparison mode</label>
          <select id="pixel-mode-select" class="ctrl-btn ctrl-select" aria-label="Pixel 3D comparison mode">
            <option value="smooth">3D: SMOOTH RETRO</option>
            <option value="quantized">3D: QUANTIZED + FACETED</option>
            <option value="lowres75">3D: PIXEL 0.75× SCALE</option>
            <option value="lowres50">3D: PIXEL 0.50× SCALE</option>
          </select>
          <button type="button" id="toggle-webgl-btn" class="ctrl-btn" aria-pressed="false">SIMULATE NO-WEBGL: OFF</button>
          <button type="button" id="reset-pref-btn" class="ctrl-btn">RESET PREF</button>
        </div>
      </nav>
    </header>
